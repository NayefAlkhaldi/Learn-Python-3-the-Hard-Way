{% extends "layout_signup.html" %}
{% block content %}
<!DOCTYPE html>

<html lang="en" >

    <head>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css?family=Asap" rel="stylesheet"><link rel="stylesheet" href="./style.css">
        <link rel= "stylesheet" type= "text/css" href="{{ url_for('static', filename='styles/signup.css') }}">
    </head>

    <body>
    <!-- partial:index.partial.html -->
        <form action="/SignUp" method="POST" class="SignUp">
            <input name="email" type="Email" placeholder="Email">
            <input name="username" type="text" placeholder="Username">
            <input name="password" type="password" placeholder="Password">
            <input name="PasswordConfirm" type="password" placeholder="Confirm Password">
            <button>Sign Up</button>
        </form>

    {% if warning %}
        <p class=Warning>{{ text }}</p>
    {% endif %}

    <h1>Sign up</h1>

    {% if not warning %}
        <p class="signIn">or <a href="{{ url_for('login') }}">log in</a></p>
    {% else %}
        <p class="signUpFixed">or <a href="{{ url_for('login') }}">log in</a></p>
    {% endif %}

    </body>
</html>

{% endblock %}
